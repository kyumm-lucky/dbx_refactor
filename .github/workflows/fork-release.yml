name: Fork Release (macOS arm64)

# Builds an installable macOS arm64 dmg from this fork and publishes it as a
# GitHub release asset.
#
# This workflow is intentionally independent of upstream's release.yml: that
# one needs Apple signing certificates, a Tauri updater private key, a
# pre-created draft release and the CNB/vsign secrets, none of which exist in
# this fork. Keeping the fork build in its own file also means upstream release
# changes merge cleanly.
#
# Output: DBX_<version>_arm64.dmg (+ .sha256) attached to the tag's release.
#
# Tag convention: fork builds use "v<upstream-version>-fork.<n>", e.g.
# v0.6.11-fork.1. Keeping a distinct name means upstream's own tags (fetched
# with `git fetch --tags`) never collide with this fork's release tags, and
# pushing upstream tags does not accidentally publish an upstream build here.
# Manual runs may pass any tag; the tag is created at the built commit if it
# does not exist yet.

on:
  push:
    tags:
      - "v*-fork.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.6.11-fork.1); created at the built commit if missing"
        required: true
        type: string
      use_lld:
        description: "Use LLVM lld instead of Apple ld64 to link the app (repo docs claim 2-3x faster linking; not yet verified in this fork)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: fork-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos-arm64-dmg:
    name: Build macOS arm64 dmg
    runs-on: macos-latest
    env:
      CARGO_INCREMENTAL: "0"
      # The Rust build is ~43 of the ~45 minutes, so compiled-object caching is
      # the only lever that matters. No S3 backend in a fork, so sccache uses the
      # GitHub Actions cache. Runs dispatched on the default branch share that
      # cache, which is why "Run workflow" is the faster path than a tag push.
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      # Linking, bundling and signing run long after the last rustc call; the
      # 10-minute default idle timeout would exit the server and zero the stats.
      SCCACHE_IDLE_TIMEOUT: "0"
    steps:
      - name: Resolve release tag
        id: rel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          case "$TAG" in
            v*) ;;
            *) echo "::error::Release tag must start with 'v', got '${TAG}'."; exit 1 ;;
          esac
          # A tag push always carries its tag. A manual run may name a tag that
          # does not exist yet: build the dispatched ref instead and let the
          # release step create the tag at that commit.
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            REF="${TAG}"
            EXISTS="true"
          else
            REF="${GITHUB_REF_NAME}"
            EXISTS="false"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"
          echo "exists=${EXISTS}" >> "$GITHUB_OUTPUT"
          echo "building ref '${REF}' for tag '${TAG}' (tag already exists: ${EXISTS})"

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.rel.outputs.ref }}

      - name: Show runner capacity
        shell: bash
        run: |
          df -h /
          echo "cpus: $(sysctl -n hw.ncpu), memory: $(( $(sysctl -n hw.memsize) / 1024 / 1024 / 1024 )) GB"

      - name: Free disk space
        shell: bash
        run: |
          set -euo pipefail
          AVAIL="$(df -g / | awk 'NR==2 {print $4}')"
          echo "free space before build: ${AVAIL} GB"
          if [ "${AVAIL}" -lt 40 ]; then
            # Only toolchains this build never uses; the Rust/macOS toolchain stays.
            rm -rf /usr/local/share/dotnet || true
            rm -rf /usr/local/.ghcup || true
            rm -rf "${ANDROID_HOME:-$HOME/Library/Android/sdk}" || true
            rm -rf "$HOME/Library/Caches/Homebrew" || true
            rm -rf "$HOME/Library/Developer/Xcode/DerivedData" || true
            df -h /
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: aarch64-apple-darwin

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
        with:
          version: "v0.10.0"

      - name: Configure sccache for C/C++ sys crates
        shell: bash
        run: |
          # -sys crates (sqlite, duckdb, ...) compile C/C++ into target/, which
          # rust-cache does not keep, so route those compilers through sccache
          # too. Expanded here because job-level env cannot interpolate
          # SCCACHE_PATH, which the action only exports at runtime.
          {
            echo "CC=${SCCACHE_PATH} clang"
            echo "CXX=${SCCACHE_PATH} clang++"
          } >> "$GITHUB_ENV"

      - name: Compute Rust dependency hash
        id: deps-hash
        shell: bash
        run: |
          {
            find . -name Cargo.toml -not -path './target/*' -print0 \
              | sort -z \
              | xargs -0 sed -E '/^version = /d'
            grep -v '^version = ' Cargo.lock
          } | shasum -a 256 | cut -d' ' -f1 | {
            read -r hash
            echo "hash=${hash:0:20}" >> "$GITHUB_OUTPUT"
          }

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./ -> target"
          # Versioned key: actions/cache entries are immutable, so reusing the
          # old key would make rust-cache skip saving the target directory.
          shared-key: fork-release-target-v1-${{ steps.deps-hash.outputs.hash }}
          add-rust-environment-hash-key: false
          # The target directory is what actually makes repeat builds cheap:
          # with it restored, cargo finds every artifact fresh and skips the
          # linking, bundling and build-script work that sccache cannot cache.
          # CARGO_INCREMENTAL=0 above keeps it small enough for the 10 GB limit.
          cache-targets: true
          cache-on-failure: true

      - name: Install frontend dependencies
        run: pnpm install

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(jq -r .version src-tauri/tauri.conf.json)"
          TAG="${{ steps.rel.outputs.tag }}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          TAG_VERSION="${TAG#v}"
          TAG_VERSION="${TAG_VERSION%%-*}"
          if [ "${TAG_VERSION}" != "${VERSION}" ]; then
            echo "::warning::Tag ${TAG} carries version ${TAG_VERSION} but tauri.conf.json says ${VERSION}."
          fi

      - name: Prepare draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.rel.outputs.tag }}
          TAG_EXISTS: ${{ steps.rel.outputs.exists }}
          VERSION: ${{ steps.ver.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          NOTES="$RUNNER_TEMP/release-notes.md"
          cat > "$NOTES" <<'EOF'
          # DBX __VERSION__ — fork build (macOS arm64)

          由 `__REPO__` 的 GitHub Actions 从 tag `__TAG__`（commit `__SHORT_SHA__`）构建，
          内容为上游 v__VERSION__ 加上本 fork 的前端改动。构建日志：__RUN_URL__

          ## 安装

          1. 下载 `DBX___VERSION___arm64.dmg` 和同名 `.sha256`。
          2. 校验：`shasum -a 256 DBX___VERSION___arm64.dmg`
          3. 打开 dmg，把 **DBX** 拖进「应用程序」。
          4. 首次打开会被 macOS 拦截（此构建没有 Apple 开发者签名与公证），任选一种方式放行：
             - 打开一次后到「系统设置 → 隐私与安全性」，在安全提示里点「仍要打开」；
             - 或执行 `xattr -dr com.apple.quarantine /Applications/DBX.app` 后再打开。

          ## 说明

          - 仅 Apple Silicon（arm64）。
          - 未签名、未公证：自用/内测构建，不适合公开分发给不特定用户。
          - **更新提醒**：应用内的更新检查走的是上游硬编码的更新源（dl.dbxio.com /
            github.com/t8y2/dbx，见 src-tauri/src/commands/update.rs），本构建无法改掉。
            上游发新版本后，应用会静默下载并提示安装，安装后本 fork 的改动会被官方版本覆盖。
            建议在「设置 → 启用更新提醒」里关闭自动检查（关闭后仍可手动检查更新）。
          - 本构建不含 Tauri 更新签名产物（build 时关闭了 createUpdaterArtifacts）。

          需要重新构建时，在 Actions 里手动触发 **Fork Release (macOS arm64)** 并填写 tag，或推送 `v<版本>-fork.<序号>` tag。
          EOF
          python3 - "$NOTES" <<'PY'
          import os, pathlib, sys

          path = pathlib.Path(sys.argv[1])
          notes = path.read_text(encoding="utf-8")
          for token, value in {
              "__VERSION__": os.environ["VERSION"],
              "__TAG__": os.environ["TAG"],
              "__REPO__": os.environ["GITHUB_REPOSITORY"],
              "__SHORT_SHA__": os.environ["GITHUB_SHA"][:8],
              "__RUN_URL__": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }.items():
              notes = notes.replace(token, value)
          path.write_text(notes, encoding="utf-8")
          PY
          # A release does not reliably create a missing tag, and the later
          # upload/edit steps resolve the release by tag name, so create the tag
          # explicitly when the manual run named a new one. Pushing the ref over
          # the checkout's credentials is used instead of the Git refs API
          # because the workflow token is refused there with "Resource not
          # accessible by integration".
          if [ "${TAG_EXISTS}" = "true" ]; then
            echo "Tag ${TAG} already exists."
          else
            echo "Creating tag ${TAG} at ${GITHUB_SHA}."
            git tag -f "${TAG}" "${GITHUB_SHA}"
            git push origin "refs/tags/${TAG}"
          fi
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; the dmg asset will be replaced."
          else
            gh release create "${TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --draft \
              --target "${GITHUB_SHA}" \
              --title "DBX ${TAG}" \
              --notes-file "$NOTES"
          fi

      - name: Install lld linker
        if: ${{ inputs.use_lld }}
        shell: bash
        run: |
          set -euo pipefail
          brew install lld
          test -x /opt/homebrew/opt/lld/bin/ld64.lld
          echo "CARGO_TARGET_AARCH64_APPLE_DARWIN_LINKER=/opt/homebrew/opt/lld/bin/ld64.lld" >> "$GITHUB_ENV"

      - name: Build macOS arm64 dmg
        shell: bash
        env:
          # A fork has no Apple Developer certificate, so Tauri would otherwise
          # ship an app whose bundle seal is missing (_CodeSignature absent):
          # `codesign --verify` fails and Gatekeeper can report a downloaded
          # copy as damaged instead of offering the usual "仍要打开" flow.
          # "-" makes codesign ad-hoc sign the bundle, which keeps the app
          # launchable on Apple Silicon while staying clearly not notarized.
          APPLE_SIGNING_IDENTITY: "-"
        run: |
          set -euo pipefail
          # Measured timing for this step on the 3-core macos-latest runner:
          # ~15s frontend build, ~30s of crate compiles served from cache, then
          # ~35min in the final link. The release profile (Cargo.toml) uses
          # lto = true, codegen-units = 1 and opt-level = "s", so that last
          # phase is fat LTO over the whole graph: neither sccache nor the
          # target cache can remove it. That is why the caches take a build
          # from ~50min to ~35min but no further; use_lld is the lever left.
          #
          # Unsigned fork build: skip the upstream updater signing key.
          #
          # Note: the app's own "check for updates" path resolves its endpoints
          # from OFFICIAL_UPDATE_ENDPOINTS in src-tauri/src/commands/update.rs,
          # which is compiled in and overrides plugins.updater.endpoints at
          # runtime. Overriding the config endpoints here therefore changes
          # nothing; only plugins.updater.pubkey would gate which signatures the
          # installed app accepts.
          CONFIG_OVERRIDE='{"bundle":{"createUpdaterArtifacts":false}}'
          pnpm tauri build --target aarch64-apple-darwin --config "${CONFIG_OVERRIDE}"

      - name: Collect dmg and checksum
        id: dmg
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          SRC="$(find target src-tauri/target -path '*/bundle/dmg/*.dmg' -type f 2>/dev/null | head -n 1 || true)"
          if [ -z "${SRC}" ]; then
            echo "::error::No dmg produced under target/*/bundle/dmg."
            exit 1
          fi
          APP_DIR="$(dirname "$(dirname "${SRC}")")/macos"
          OUT="DBX_${VERSION}_arm64.dmg"
          cp "${SRC}" "${OUT}"
          shasum -a 256 "${OUT}" | tee "${OUT}.sha256"
          {
            echo "file=${OUT}"
            echo "app_dir=${APP_DIR}"
          } >> "$GITHUB_OUTPUT"
          df -h /

      - name: Verify dmg integrity
        shell: bash
        run: |
          set -euo pipefail
          DMG="${{ steps.dmg.outputs.file }}"
          APP="${{ steps.dmg.outputs.app_dir }}/DBX.app"
          hdiutil verify "${DMG}"
          # Hard gate: a bundle without a valid seal must not be published.
          codesign --verify --deep --strict --verbose=2 "${APP}"
          codesign -dv --verbose=4 "${APP}" 2>&1 | grep -E "^(Identifier|Format|Signature|TeamIdentifier|CodeDirectory)" || true

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.rel.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          FILE="${{ steps.dmg.outputs.file }}"
          gh release upload "${TAG}" "${FILE}" "${FILE}.sha256" \
            --repo "${GITHUB_REPOSITORY}" --clobber
          gh release edit "${TAG}" --repo "${GITHUB_REPOSITORY}" --draft=false
          echo "Published: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          echo "Download:  ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${TAG}/${FILE}"

      - name: Show sccache stats
        if: always()
        continue-on-error: true
        shell: bash
        run: ${SCCACHE_PATH} --show-stats
