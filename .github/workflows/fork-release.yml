name: Fork Release (macOS arm64)

# Builds an installable macOS arm64 dmg from this fork and publishes it as a
# GitHub release asset.
#
# This workflow is intentionally independent of upstream's release.yml: that
# one needs Apple signing certificates, a Tauri updater private key, a
# pre-created draft release and the CNB/vsign secrets, none of which exist in
# this fork. Keeping the fork build in its own file also means upstream release
# changes merge cleanly.
#
# Output: DBX_<version>_arm64.dmg (+ .sha256) attached to the tag's release.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and publish (must start with v, e.g. v0.6.11)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: fork-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos-arm64-dmg:
    name: Build macOS arm64 dmg
    runs-on: macos-latest
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Resolve release tag
        id: rel
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          case "$TAG" in
            v*) ;;
            *) echo "::error::Release tag must start with 'v', got '${TAG}'."; exit 1 ;;
          esac
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.rel.outputs.tag }}

      - name: Show runner capacity
        shell: bash
        run: |
          df -h /
          echo "cpus: $(sysctl -n hw.ncpu), memory: $(( $(sysctl -n hw.memsize) / 1024 / 1024 / 1024 )) GB"

      - name: Free disk space
        shell: bash
        run: |
          set -euo pipefail
          AVAIL="$(df -g / | awk 'NR==2 {print $4}')"
          echo "free space before build: ${AVAIL} GB"
          if [ "${AVAIL}" -lt 40 ]; then
            # Only toolchains this build never uses; the Rust/macOS toolchain stays.
            rm -rf /usr/local/share/dotnet || true
            rm -rf /usr/local/.ghcup || true
            rm -rf "${ANDROID_HOME:-$HOME/Library/Android/sdk}" || true
            rm -rf "$HOME/Library/Caches/Homebrew" || true
            rm -rf "$HOME/Library/Developer/Xcode/DerivedData" || true
            df -h /
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: aarch64-apple-darwin

      - name: Install frontend dependencies
        run: pnpm install

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(jq -r .version src-tauri/tauri.conf.json)"
          TAG="${{ steps.rel.outputs.tag }}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if [ "v${VERSION}" != "${TAG}" ]; then
            echo "::warning::Tag ${TAG} does not match tauri.conf.json version ${VERSION}."
          fi

      - name: Prepare draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.rel.outputs.tag }}
          VERSION: ${{ steps.ver.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          NOTES="$RUNNER_TEMP/release-notes.md"
          cat > "$NOTES" <<'EOF'
          # DBX __VERSION__ — fork build (macOS arm64)

          由 `__REPO__` 的 GitHub Actions 从 tag `__TAG__`（commit `__SHORT_SHA__`）构建，
          内容为上游 v__VERSION__ 加上本 fork 的前端改动。构建日志：__RUN_URL__

          ## 安装

          1. 下载 `DBX___VERSION___arm64.dmg` 和同名 `.sha256`。
          2. 校验：`shasum -a 256 DBX___VERSION___arm64.dmg`
          3. 打开 dmg，把 **DBX** 拖进「应用程序」。
          4. 首次打开会被 macOS 拦截（此构建没有 Apple 开发者签名与公证），任选一种方式放行：
             - 打开一次后到「系统设置 → 隐私与安全性」，在安全提示里点「仍要打开」；
             - 或执行 `xattr -dr com.apple.quarantine /Applications/DBX.app` 后再打开。

          ## 说明

          - 仅 Apple Silicon（arm64）。
          - 未签名、未公证：自用/内测构建，不适合公开分发给不特定用户。
          - 应用内自动更新已指向本仓库的 release，不会自动升级成上游官方版本，fork 改动不会被覆盖。

          需要重新构建时，在 Actions 里手动触发 **Fork Release (macOS arm64)** 并填写 tag，或推送任意 `v*` tag。
          EOF
          python3 - "$NOTES" <<'PY'
          import os, pathlib, sys

          path = pathlib.Path(sys.argv[1])
          notes = path.read_text(encoding="utf-8")
          for token, value in {
              "__VERSION__": os.environ["VERSION"],
              "__TAG__": os.environ["TAG"],
              "__REPO__": os.environ["GITHUB_REPOSITORY"],
              "__SHORT_SHA__": os.environ["GITHUB_SHA"][:8],
              "__RUN_URL__": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }.items():
              notes = notes.replace(token, value)
          path.write_text(notes, encoding="utf-8")
          PY
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; the dmg asset will be replaced."
          else
            gh release create "${TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --draft \
              --verify-tag \
              --title "DBX ${TAG}" \
              --notes-file "$NOTES"
          fi

      - name: Build macOS arm64 dmg
        shell: bash
        run: |
          set -euo pipefail
          # Unsigned fork build: skip the upstream updater signing key, and point
          # the in-app updater at this fork so an installed copy never silently
          # replaces itself with the official upstream build.
          CONFIG_OVERRIDE='{"bundle":{"createUpdaterArtifacts":false},"plugins":{"updater":{"endpoints":["https://github.com/kyumm-lucky/dbx_refactor/releases/latest/download/latest.json"]}}}'
          pnpm tauri build --target aarch64-apple-darwin --config "${CONFIG_OVERRIDE}"

      - name: Collect dmg and checksum
        id: dmg
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          SRC="$(find target src-tauri/target -path '*/bundle/dmg/*.dmg' -type f 2>/dev/null | head -n 1 || true)"
          if [ -z "${SRC}" ]; then
            echo "::error::No dmg produced under target/*/bundle/dmg."
            exit 1
          fi
          APP_DIR="$(dirname "$(dirname "${SRC}")")/macos"
          OUT="DBX_${VERSION}_arm64.dmg"
          cp "${SRC}" "${OUT}"
          shasum -a 256 "${OUT}" | tee "${OUT}.sha256"
          {
            echo "file=${OUT}"
            echo "app_dir=${APP_DIR}"
          } >> "$GITHUB_OUTPUT"
          df -h /

      - name: Verify dmg integrity
        shell: bash
        run: |
          set -euo pipefail
          hdiutil verify "${{ steps.dmg.outputs.file }}"
          echo "signature of the bundled app:"
          codesign -dv --verbose=2 "${{ steps.dmg.outputs.app_dir }}/DBX.app" 2>&1 | head -n 12 || true

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.rel.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          FILE="${{ steps.dmg.outputs.file }}"
          gh release upload "${TAG}" "${FILE}" "${FILE}.sha256" \
            --repo "${GITHUB_REPOSITORY}" --clobber
          gh release edit "${TAG}" --repo "${GITHUB_REPOSITORY}" --draft=false
          echo "Published: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          echo "Download:  ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${TAG}/${FILE}"
